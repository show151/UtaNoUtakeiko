<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ノーツの種類 | Uta no Utakeiko</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body id="top">
    <header class="site-header">
      <a href="#top" aria-label="ページの先頭へ戻る">
        <img src="Pictures/rogo.png" alt="Uta no Utakeiko" />
      </a>
    </header>

    <main class="page">
      <header class="hero">
        <h1>ゲームの流れ</h1>
      </header>
      <section id="start">
        <h2 class="section-title">スタート画面</h2>
          <img
            class="note-image"
            src="Pictures/01-start.png"
            alt="スタート画面の画像"
          />
        </div>
        <p class="description">ボタンを押して難易度選択画面へ!</p>
      </section>

      <section id="difficulty">
        <h2 class="section-title">難易度選択</h2>
          <img
            class="note-image"
            src="Pictures/02-difficulty.png"
            alt="セレクト画面の画像"
          />
        </div>
        <p class="description">赤ボタンを押して難易度を選択、黄色ボタンを押して決定!</p>
      </section>

      <section id="play">
        <h2 class="section-title">プレイ画面</h2>
          <img
            class="note-image"
            src="Pictures/03-play.png"
            alt="プレイ画面の画像"
          />
        </div>
        <p class="description">ゲームスタート。ウタが歌う譜面を作ろう!</p>
      </section>

      <section id="sing">
        <h2 class="section-title">歌唱画面</h2>
          <img
            class="note-image"
            src="Pictures/04-singing.png"
            alt="歌唱画面の画像"
          />
        </div>
        <p class="description">ウタの歌唱を聞こう!</p>
      </section>

      <section id="result">
        <h2 class="section-title">結果画面</h2>
          <img
            class="note-image"
            src="Pictures/05-result.png"
            alt="結果画面の画像"
          />
        </div>
        <p class="description">プレイ結果を表示。高得点を目指そう!</p>
      </section>

      <section id="ranking">
        <h2 class="section-title">ランキング画面</h2>
          <img
            class="note-image"
            src="Pictures/06-ranking.png"
            alt="結果画面の画像"
          />
        </div>
        <p class="description">一日のランキングを表示。10位以内に入ると名前を残せるよ!</p>
      </section>　

      <header class="hero">
        <h1>プレイ方法</h1>
      </header>

      <section id="tap">
        <h2 class="section-title">TAP</h2>
        <div class="note-grid">
          <img
            class="note-image"
            src="Pictures/tap.png"
            alt="TAPノーツの画像"
          />
        </div>
        <p class="description">音符に合わせて黄色ボタンをPUSH!</p>
      </section>

      <section id="hold">
        <h2 class="section-title">HOLD</h2>
        <div class="note-grid">
          <img
            class="note-image"
            src="Pictures/hold.png"
            alt="HOLDノーツの画像"
          />
        </div>
        <p class="description">黄色ボタンを押したら最後まで長押し!</p>
      </section>

      <!-- <section id="hold+tap">
        <h2 class="section-title">HOLD+TAP</h2>
        <div class="note-grid">
          <img
            class="note-image"
            src="Pictures/kari.png"
            alt="HOLD+TAPノーツの画像"
          />
        </div>
        <p class="description">
          黄色ボタンを押しながらタイミングよく赤ボタンを押そう!
        </p>
      </section>

      <footer>Uta no Utakeiko　|　Game Guide</footer> -->
    </main>
  </body>
</html>
